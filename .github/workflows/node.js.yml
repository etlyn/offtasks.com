name: Checks and GitHub Pages deploy

# main is staging and release is production. Both are checked; only release is published.
on:
  push:
    branches: [main, release]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Use the pinned Node.js version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: |
          if [ -e yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -e package-lock.json ]; then
            npm ci
          else
            npm i
          fi

      - name: Check password recovery
        run: |
          yarn typecheck
          yarn test:password-recovery
          yarn test:google-auth

      - name: Check isolated integration and data boundaries
        run: |
          yarn test:codex
          yarn test:chatgpt-connection
          yarn test:database
          yarn test:delete-account
          yarn test:analytics
          yarn test:planner

      - name: Check the web reminder dispatcher
        working-directory: supabase/functions/offtask-web-reminders
        run: |
          npx --yes deno@2.9.6 check --frozen index.ts
          npx --yes deno@2.9.6 test --frozen --allow-env

      - name: Build
        run: |
          if [ -e yarn.lock ]; then
            yarn build
          else
            npm run build
          fi
          yarn test:privacy
          touch ./build/.nojekyll
        env:
          VITE_PUBLIC_SITE_URL: https://www.offtasks.com
          VITE_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          VITE_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy 🚀
        if: github.ref == 'refs/heads/release'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: public
          folder: build
